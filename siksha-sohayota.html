<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>শিক্ষা সহায়তা | Budbud SANHATI</title>

<meta name="description"
content="Budbud SANHATI - শিক্ষা সহায়তা কার্যক্রম">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050000;
    color:#fff;
    font-family:"Noto Serif Bengali",serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}


/* =========================
   NAVBAR
========================= */

.navbar{
    position:sticky;
    top:0;
    z-index:9999;

    width:100%;
    min-height:68px;

    background:#050505;

    border-bottom:3px solid #e00000;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow-x:auto;
}

.nav-menu{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:42px;

    list-style:none;

    padding:0 20px;

    min-width:max-content;
}

.nav-menu a{
    position:relative;

    color:#f3d49a;

    font-size:18px;
    font-weight:700;

    white-space:nowrap;

    padding:20px 0;

    transition:.3s;
}

.nav-menu a:hover{
    color:#ff1515;
}

.nav-menu a::after{
    content:"";

    position:absolute;

    left:0;
    bottom:7px;

    width:0;
    height:3px;

    background:#ff0000;

    transition:.3s;
}

.nav-menu a:hover::after{
    width:100%;
}


/* =========================
   PAGE HEADER
========================= */

.page-header{
    text-align:center;

    padding:70px 20px 50px;

    background:
        radial-gradient(
            circle at center,
            #320000 0%,
            #100000 50%,
            #050000 100%
        );

    border-bottom:2px solid #8c0000;
}

.page-icon{
    font-size:78px;

    margin-bottom:18px;

    filter:
        drop-shadow(0 0 10px #ffb300)
        drop-shadow(0 0 20px rgba(255,150,0,.4));
}

.page-header h1{
    color:#ffc400;

    font-size:42px;

    font-weight:800;

    margin-bottom:15px;
}

.page-header h1::after{
    content:"✦";

    display:block;

    color:#b87900;

    font-size:20px;

    margin-top:8px;
}

.page-header p{
    max-width:800px;

    margin:auto;

    color:#eee;

    font-size:19px;

    line-height:2;
}


/* =========================
   MAIN CONTAINER
========================= */

.container{
    width:100%;

    max-width:1000px;

    margin:auto;

    padding:55px 20px 80px;
}


/* =========================
   INTRO CARD
========================= */

.intro-card{
    background:#110000;

    border:2px solid #7a2900;

    border-radius:18px;

    padding:35px 25px;

    text-align:center;

    margin-bottom:30px;

    box-shadow:
        0 0 25px rgba(255,180,0,.08);
}

.intro-card h2{
    color:#ffc400;

    font-size:30px;

    margin-bottom:20px;
}

.intro-card p{
    color:#eee;

    font-size:18px;

    line-height:2;

    margin-bottom:12px;
}

.intro-card p:last-child{
    margin-bottom:0;
}


/* =========================
   SUPPORT GRID
========================= */

.support-grid{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:25px;

    margin-top:30px;
}

.support-card{
    background:#100000;

    border:1px solid #6b2300;

    border-radius:15px;

    padding:30px 22px;

    text-align:center;

    transition:.3s;
}

.support-card:hover{
    transform:translateY(-5px);

    border-color:#ffc400;

    box-shadow:
        0 0 20px rgba(255,190,0,.15);
}

.support-icon{
    font-size:55px;

    margin-bottom:15px;
}

.support-card h3{
    color:#ffc400;

    font-size:24px;

    margin-bottom:14px;
}

.support-card p{
    color:#ddd;

    font-size:16px;

    line-height:1.9;
}


/* =========================
   MESSAGE
========================= */

.message{
    margin-top:35px;

    background:#160000;

    border-left:5px solid #ffc400;

    border-radius:10px;

    padding:28px 22px;

    text-align:center;
}

.message h2{
    color:#ffc400;

    font-size:28px;

    margin-bottom:15px;
}

.message p{
    color:#eee;

    font-size:17px;

    line-height:2;
}


/* =========================
   CONTACT BUTTON
========================= */

.button-area{
    text-align:center;

    margin-top:40px;
}

.contact-button{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:230px;

    padding:14px 28px;

    border-radius:14px;

    background:linear-gradient(
        180deg,
        #ff1919,
        #d60000
    );

    border:3px solid #ffc400;

    color:#ffe8a0;

    font-size:20px;

    font-weight:800;

    box-shadow:
        0 0 12px #ffb300,
        0 0 28px rgba(255,180,0,.4);

    transition:.3s;
}

.contact-button:hover{
    transform:scale(1.05);
}


/* =========================
   BACK BUTTON
========================= */

.back-area{
    text-align:center;

    margin-top:22px;
}

.back-button{
    display:inline-block;

    color:#ffc400;

    font-size:17px;

    padding:10px 20px;

    border:1px solid #ffc400;

    border-radius:10px;

    transition:.3s;
}

.back-button:hover{
    background:#ffc400;

    color:#050000;
}


/* =========================
   DURGA BANNER
========================= */

.durga-banner{
    width:100%;

    min-height:175px;

    background:
        radial-gradient(
            circle at center,
            #380b00 0%,
            #150000 45%,
            #030000 100%
        );

    border-top:2px solid #8c0000;

    border-bottom:2px solid #8c0000;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;
}

.trident{
    font-size:50px;

    color:#ffc400;

    line-height:1;

    text-shadow:
        0 0 15px #ff9d00;
}

.durga-banner h2{
    color:#ffc400;

    font-size:38px;

    margin-top:8px;
}


/* =========================
   FOOTER
========================= */

footer{
    background:#030303;

    border-top:2px solid #ff0000;

    text-align:center;
}

.footer-info{
    padding:25px 15px;

    color:#ddd;

    font-size:14px;

    line-height:1.9;
}

.footer-info strong{
    color:#ffc400;
}

.footer-info a:hover{
    color:#ffc400;
}

.copyright{
    border-top:1px solid #331000;

    padding:15px;

    color:#999;

    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    .navbar{
        justify-content:flex-start;
    }

    .nav-menu{
        justify-content:flex-start;

        gap:28px;
    }

    .nav-menu a{
        font-size:16px;

        padding:19px 0;
    }

    .page-header{
        padding:52px 16px 38px;
    }

    .page-icon{
        font-size:65px;
    }

    .page-header h1{
        font-size:33px;
    }

    .page-header p{
        font-size:17px;

        line-height:1.9;
    }

    .container{
        padding:40px 15px 60px;
    }

    .intro-card{
        padding:28px 18px;
    }

    .intro-card h2{
        font-size:26px;
    }

    .intro-card p{
        font-size:16px;

        line-height:2;
    }

    .support-grid{
        grid-template-columns:1fr;

        gap:18px;
    }

    .support-card{
        padding:28px 18px;
    }

    .support-card h3{
        font-size:22px;
    }

    .support-card p{
        font-size:15px;

        line-height:1.9;
    }

    .message{
        padding:25px 18px;
    }

    .message h2{
        font-size:24px;
    }

    .message p{
        font-size:15px;
    }

    .durga-banner{
        min-height:150px;
    }

    .durga-banner h2{
        font-size:31px;
    }

}


/* =========================
   SMALL PHONE
========================= */

@media(max-width:420px){

    .nav-menu{
        gap:24px;

        padding:0 16
