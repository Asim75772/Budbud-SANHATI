<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Budbud SANHATI</title>

<meta name="description"
      content="Budbud SANHATI - একটি সংস্কৃতি, একটি পরিবার, একটি অঙ্গীকার">

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050000;
    color:#fff;
    font-family:"Noto Serif Bengali",serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    max-width:100%;
    display:block;
}


/* =====================================================
   NAVBAR
===================================================== */

.navbar{
    position:sticky;
    top:0;
    z-index:9999;

    width:100%;
    height:72px;

    background:#050505;

    border-bottom:3px solid #e00000;

    display:flex;
    align-items:center;
    justify-content:center;
}

.nav-container{
    width:100%;
    max-width:1200px;
}

.nav-menu{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:55px;

    list-style:none;
}

.nav-menu a{
    position:relative;

    color:#f3d49a;

    font-size:19px;
    font-weight:700;

    padding:22px 0;

    white-space:nowrap;

    transition:.3s;
}

.nav-menu a:hover,
.nav-menu a.active{
    color:#ff1515;
}

.nav-menu a::after{
    content:"";

    position:absolute;

    left:0;
    bottom:5px;

    width:0;
    height:4px;

    background:#ff0000;

    transition:.3s;
}

.nav-menu a:hover::after,
.nav-menu a.active::after{
    width:100%;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    position:relative;

    width:100%;

    background:#050000;

    border-bottom:3px solid #e00000;

    overflow:hidden;
}

.hero-image{
    width:100%;
    height:auto;
    display:block;
}

.hero-content{
    position:absolute;

    left:50%;
    bottom:38px;

    transform:translateX(-50%);

    text-align:center;

    z-index:5;
}

.welcome-btn{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:240px;
    height:60px;

    padding:0 40px;

    border-radius:15px;

    background:linear-gradient(
        180deg,
        #ff1919,
        #d60000
    );

    border:3px solid #ffc400;

    box-shadow:
        0 0 12px #ffb300,
        0 0 30px rgba(255,180,0,.55);

    color:#ffe8a0;

    font-size:25px;
    font-weight:800;

    transition:.3s;
}

.welcome-btn:hover{
    transform:scale(1.05);
}

.down-arrow{
    display:block;

    margin-top:5px;

    font-size:27px;

    color:#ffd000;

    animation:arrowMove 1.4s infinite;
}

@keyframes arrowMove{

    0%{
        transform:translateY(0);
        opacity:.6;
    }

    50%{
        transform:translateY(8px);
        opacity:1;
    }

    100%{
        transform:translateY(0);
        opacity:.6;
    }
}


/* =====================================================
   QUICK MENU
===================================================== */

.quick-section{
    width:100%;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    background:#080000;

    border-bottom:1px solid #5b2100;
}

.quick-card{
    min-height:235px;

    padding:30px 20px;

    text-align:center;

    border-right:1px solid #4b1800;

    transition:.3s;
}

.quick-card:last-child{
    border-right:none;
}

.quick-card:hover{
    background:#140000;
}

.quick-icon{
    width:62px;
    height:62px;

    margin:0 auto 15px;

    border:2px solid #ffc400;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:29px;
}

.quick-card h3{
    color:#ffc400;

    font-size:21px;

    margin-bottom:12px;
}

.quick-card p{
    color:#ddd;

    font-size:14px;

    line-height:1.8;
}


/* =====================================================
   SECTION
===================================================== */

.section{
    width:100%;

    padding:80px 20px;

    background:#070000;

    border-bottom:1px solid #401500;
}

.section-container{
    width:100%;

    max-width:1050px;

    margin:auto;
}

.section-title{
    text-align:center;

    color:#ffc400;

    font-size:38px;

    margin-bottom:45px;

    font-weight:800;
}

.section-title::after{
    content:"✦";

    display:block;

    color:#b87900;

    font-size:20px;

    margin-top:8px;
}


/* =====================================================
   ABOUT
===================================================== */

.about-content{
    text-align:center;

    max-width:850px;

    margin:auto;
}

.big-icon{
    width:125px;
    height:125px;

    margin:0 auto 35px;

    border:4px solid #ffc400;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:60px;
}

.about-content p{
    color:#eee;

    font-size:20px;

    line-height:2.1;

    margin-bottom:15px;
}


/* =====================================================
   ABOUT BUTTON
===================================================== */

.about-button-box{
    text-align:center;

    margin-top:35px;
}

.about-button{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:240px;

    padding:14px 30px;

    border-radius:14px;

    background:linear-gradient(
        180deg,
        #ff1919,
        #d60000
    );

    border:3px solid #ffc400;

    box-shadow:
        0 0 12px #ffb300,
        0 0 28px rgba(255,180,0,.45);

    color:#ffe8a0;

    font-size:21px;

    font-weight:800;

    transition:.3s;
}

.about-button:hover{
    transform:scale(1.05);
}


/* =====================================================
   EVENTS
===================================================== */

.event-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:25px;
}

.event-card{
    height:100%;

    background:#110000;

    border:1px solid #6b2300;

    border-radius:12px;

    padding:30px 20px;

    text-align:center;

    transition:.3s;
}

.event-card:hover{
    transform:translateY(-5px);

    border-color:#ffc400;

    box-shadow:
        0 0 20px rgba(255,180,0,.15);
}

.event-link{
    display:block;

    height:100%;
}

.event-icon{
    font-size:48px;

    margin-bottom:15px;
}

.event-card h3{
    color:#ffc400;

    font-size:23px;

    margin-bottom:12px;
}

.event-card p{
    color:#ddd;

    font-size:15px;

    line-height:1.8;
}


/* =====================================================
   GALLERY
===================================================== */

.gallery-grid{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:25px;
}

.gallery-item{
    position:relative;

    width:100%;
    height:360px;

    background:#110000;

    border:2px solid #6b2300;

    border-radius:14px;

    overflow:hidden;

    cursor:pointer;

    transition:.3s;
}

.gallery-item:hover{
    transform:translateY(-5px);

    border-color:#ffc400;

    box-shadow:
        0 0 25px rgba(255,180,0,.25);
}

.gallery-item img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:.4s;

    background:#180000;
}

.gallery-item:hover img{
    transform:scale(1.04);
}

.gallery-label{
    position:absolute;

    left:15px;
    bottom:15px;

    padding:7px 15px;

    background:rgba(0,0,0,.75);

    border:1px solid #ffc400;

    border-radius:20px;

    color:#ffc400;

    font-size:15px;

    z-index:2;
}


/* =====================================================
   IMAGE POPUP
===================================================== */

.image-modal{
    display:none;

    position:fixed;

    inset:0;

    z-index:100000;

    background:rgba(0,0,0,.94);

    align-items:center;

    justify-content:center;

    padding:20px;
}

.image-modal.show{
    display:flex;
}

.modal-image{
    max-width:95%;

    max-height:90vh;

    width:auto;

    height:auto;

    object-fit:contain;

    border:3px solid #ffc400;

    border-radius:10px;

    box-shadow:
        0 0 35px rgba(255,190,0,.35);
}

.close-modal{
    position:absolute;

    top:18px;
    right:25px;

    width:48px;
    height:48px;

    border-radius:50%;

    border:2px solid #ffc400;

    background:#100000;

    color:#ffc400;

    font-size:32px;

    cursor:pointer;

    z-index:100001;
}

.close-modal:hover{
    background:#ff0000;

    color:#fff;
}


/* =====================================================
   CONTACT
===================================================== */

.contact-grid{
    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:25px;

    max-width:900px;

    margin:auto;
}

.contact-card{
    background:#100000;

    border:1px solid #6a2300;

    border-radius:12px;

    padding:30px 20px;

    text-align:center;
}

.contact-card .icon{
    font-size:40px;

    margin-bottom:12px;
}

.contact-card h3{
    color:#ffc400;

    font-size:22px;

    margin-bottom:12px;
}

.contact-card a,
.contact-card p{
    color:#eee;

    font-size:17px;

    line-height:1.8;
}

.contact-card a:hover{
    color:#ffc400;
}


/* =====================================================
   DURGA BANNER
================================================
