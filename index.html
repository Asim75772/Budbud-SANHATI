
<!DOCTYPE html>

<title>Budbud SANHATI | স্বাগতম</title>

<style>
* {

    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Noto Sans Bengali", sans-serif;
    background: #080808;
    color: white;
}

.hero {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 20px;

    background:
        radial-gradient(circle at center, #3b0000 0%, #160000 45%, #050000 100%);
}

.hero-content {
    width: 100%;
    max-width: 800px;
}

.logo {
    width: 130px;
    height: 130px;
    margin: 0 auto 25px;

    border-radius: 50%;

    align-items: center;
    justify-content: center;

    background: #111;

    font-size: 60px;
    font-weight: bold;
    color: #ffd21a;

    box-shadow: 0 0 30px rgba(255,210,26,.5);
}

h1 {
    color: #ffd21a;
    font-size: 44px;
    margin-bottom: 15px;
}

h2 {
    font-size: 27px;
    margin-bottom: 18px;
}

p {
    color: #ddd;
    font-size: 18px;
    line-height: 1.8;
}

.btn {
    display: inline-block;

    margin-top: 30px;
    padding: 14px 30px;

    border-radius: 30px;

    background: #ff1744;
    color: white;

    text-decoration: none;
    font-weight: bold;
    font-size: 18px;
}

.btn:hover {
    background: #ffd21a;
    color: #111;
}

@media (max-width: 600px) {

    h1 {
        font-size: 34px;
    }

    h2 {
        font-size: 22px;
    }

    p {
        font-size: 16px;
    }

    .logo {
        width: 110px;
        height: 110px;
        font-size: 50px;
    }

</head>

<body>

            Budbud Sanhati-এর অফিসিয়াল ওয়েবসাইটে আপনাকে স্বাগতম।
