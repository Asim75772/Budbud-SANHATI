# Final `index.html`

```html
<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Budbud SANHATI | বুদবুদ সংহতি</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:
        Arial,
        "Noto Sans Bengali",
        "Noto Sans",
        sans-serif;
    overflow-x:hidden;
}

img{
    max-width:100%;
    display:block;
}


/* =========================
   NAVIGATION
========================= */

header{
    width:100%;
    height:64px;
    background:#050505;
    border-bottom:3px solid #b00000;
    position:sticky;
    top:0;
    z-index:9999;
}

.navbar{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
}

.nav-menu{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:48px;
    list-style:none;
    padding:0 20px;
}

.nav-menu li{
    flex-shrink:0;
}

.nav-menu a{
    position:relative;
    display:block;
    padding:22px 0 17px;
    color:#f4dda0;
    text-decoration:none;
    font-size:17px;
    font-weight:500;
    white-space:nowrap;
    transition:.3s;
}

.nav-menu a:hover{
    color:#ff1515;
}

.nav-menu a.active{
    color:#ff1515;
}

.nav-menu a.active::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:4px;
    background:#ff0000;
}


/* =========================
   HERO
========================= */

.hero{
    width:100%;
    background:#000;
    border-bottom:3px solid #b00000;
    overflow:hidden;
}

.hero-image{
    width:100%;
    height:auto;
    display:block;
}


/* =========================
   WELCOME
========================= */

.welcome-area{
    width:100%;
    padding:16px 15px 20px;
    text-align:center;

    background:
        radial-gradient(
            circle at center,
            #280000 0%,
            #100000 50%,
            #000 100%
        );

    border-bottom:2px solid #8b0000;
}

.welcome-button{
    display:inline-block;

    min-width:220px;

    padding:10px 35px;

    border:2px solid #e8b400;
    border-radius:14px;

    background:
        linear-gradient(
            180deg,
            #d00000,
            #720000
        );

    color:#ffe7a0;

    font-size:22px;
    font-weight:bold;

    text-decoration:none;

    box-shadow:
        0 0 15px rgba(255,180,0,.25);

    transition:.3s;
}

.welcome-button:hover{
    transform:scale(1.03);

    background:
        linear-gradient(
            180deg,
            #ed0000,
            #850000
        );
}


/* =========================
   FOUR INFO BOXES
========================= */

.info-section{
    width:100%;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    background:#090000;

    border-bottom:2px solid #654300;
}

.info-box{
    min-height:285px;

    padding:27px 18px 24px;

    text-align:center;

    border-right:1px solid #543800;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.info-box:last-child{
    border-right:none;
}

.info-icon{
    width:70px;
    height:70px;

    margin-bottom:14px;

    border:2px solid #ffd000;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050000;

    font-size:32px;

    box-shadow:
        0 0 12px rgba(255,200,0,.15);
}

.info-box h2{
    color:#ffd000;

    font-size:20px;

    margin-bottom:12px;
}

.info-box p{
    max-width:260px;

    color:#eee;

    font-size:14px;

    line-height:1.7;
}


/* =========================
   JOY MA DURGA
========================= */

.durga-section{
    width:100%;

    min-height:165px;

    background:
        radial-gradient(
            ellipse at center,
            #350000 0%,
            #160000 50%,
            #000 100%
        );

    border-bottom:3px solid #a00000;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:20px;
}

.durga-symbol{
    font-size:50px;

    line-height:1;

    color:#ffb700;

    text-shadow:
        0 0 12px rgba(255,180,0,.6);
}

.durga-title{
    margin-top:6px;

    color:#f0a900;

    font-size:38px;

    font-weight:bold;

    text-shadow:
        0 0 8px rgba(255,160,0,.35);
}


/* =========================
   CONTENT SECTIONS
========================= */

.content-section{
    width:100%;

    min-height:420px;

    padding:65px 25px;

    background:#050000;

    border-bottom:1px solid #4c3000;

    text-align:center;

    scroll-margin-top:65px;
}

.content-icon{
    width:105px;
    height:105px;

    margin:0 auto 28px;

    border:3px solid #ffd000;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#030303;

    font-size:48px;
}

.content-section h2{
    color:#ffd000;

    font-size:34px;

    margin-bottom:25px;
}

.content-section p{
    max-width:850px;

    margin:0 auto;

    color:#eee;

    font-size:19px;

    line-height:2;
}


/* =========================
   GALLERY
========================= */

.gallery-section{
    background:#020202;
}

.gallery-placeholder{
    max-width:900px;

    min-height:180px;

    margin:30px auto 0;

    border:1px dashed #8a6200;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#c4a85c;

    background:#080000;

    padding:30px;

    font-size:17px;
}


/* =========================
   CONTACT
========================= */

.contact-footer{
    width:100%;

    background:#030303;

    border-top:2px solid #7c0000;
}

.contact-container{
    width:100%;

    display:grid;

    grid-template-columns:repeat(4,1fr);
}

.contact-box{
    min-height:105px;

    padding:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:12px;

    border-right:1px solid #503300;
}

.contact-box:last-child{
    border-right:none;
}

.contact-icon{
    width:38px;

    color:#f0b000;

    font-size:27px;

    text-align:center;

    flex-shrink:0;
}

.contact-text{
    color:#ddd;

    font-size:13px;

    line-height:1.6;
}

.contact-text a{
    color:#ddd;

    text-decoration:none;
}

.contact-text a:hover{
    color:#ffd000;
}


/* =========================
   COPYRIGHT
========================= */

.copyright{
    width:100%;

    padding:12px 10px;

    background:#000;

    border-top:1px solid #4c3000;
    border-bottom:3px solid #b00000;

    color:#bda55b;

    text-align:center;

    font-size:12px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    header{
        height:60px;
    }

    .navbar{
        overflow-x:auto;
        justify-content:flex-start;
        scrollbar-width:none;
    }

    .navbar::-webkit-scrollbar{
        display:none;
    }

    .nav-menu{
        width:max-content;
        min-width:max-content;

        justify-content:flex-start;

        gap:34px;

        padding:0 25px;
    }

    .nav-menu a{
        font-size:16px;

        padding:20px 0 15px;
    }

    .info-section{
        grid-template-columns:repeat(2,1fr);
    }

    .info-box{
        min-height:280px;
        padding:25px 14px;

        border-bottom:1px solid #543800;
    }

    .info-box:nth-child(2),
    .info-box:nth-child(4){
        border-right:none;
    }

    .info-box h2{
        font-size:19px;
    }

    .info-box p{
        font-size:13px;
    }

    .durga-section{
        min-height:150px;
    }

    .durga-title{
        font-size:32px;
    }

    .content-section{
        padding:55px 20px;
    }

    .content-section h2{
        font-size:30px;
    }

    .content-section p{
        font-size:17px;
    }

    .contact-container{
        grid-template-columns:repeat(2,1fr);
    }

    .contact-box{
        min-height:90px;

        border-bottom:1px solid #503300;
    }

    .contact-box:nth-child(2),
    .contact-box:nth-child(4){
        border-right:none;
    }
}

        min-height:auto;

        padding:32px 25px;

        border-right:none !important;
    }

        border-bottom:none;
