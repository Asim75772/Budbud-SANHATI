<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Budbud SANHATI | বুদবুদ সংহতি</title>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        "Noto Sans Bengali",
        "Nirmala UI",
        Arial,
        sans-serif;

    background:#120000;
    color:#fff;
    overflow-x:hidden;
}

img{
    max-width:100%;
    display:block;
}

a{
    text-decoration:none;
}


/* =========================
   HEADER
========================= */

header{
    width:100%;
    background:#050505;

    border-bottom:2px solid #a40000;

    position:sticky;
    top:0;
    z-index:1000;
}

.navbar{
    width:100%;
    min-height:72px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.nav-menu{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:48px;

    list-style:none;

    padding:0 20px;
}

.nav-menu li{
    flex-shrink:0;
}

.nav-menu a{
    position:relative;

    display:block;

    color:#f5df9a;

    font-family:Arial,sans-serif;

    font-size:18px;
    font-weight:500;

    padding:25px 0 18px;

    transition:0.3s;
}

.nav-menu a:hover{
    color:#ff2020;
}

.nav-menu a.active{
    color:#ff2020;
}

.nav-menu a.active::after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:4px;

    background:#ff1515;
}


/* =========================
   HERO
========================= */

.hero{
    width:100%;

    background-image:url("home-banner.png");

    background-size:100% auto;
    background-position:center top;
    background-repeat:no-repeat;

    aspect-ratio:16 / 9;

    position:relative;

    border-bottom:3px solid #a40000;
}


/* =========================
   DURGA SECTION
========================= */

.durga-section{
    width:100%;

    min-height:260px;

    background:
        radial-gradient(
            circle at center,
            #420000 0%,
            #230000 35%,
            #120000 75%
        );

    border-bottom:3px solid #a40000;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:35px 20px;
}

.durga-content{
    width:100%;
    max-width:800px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.durga-symbol{
    font-size:70px;

    line-height:1;

    color:#ffbf00;

    text-shadow:
        0 0 8px #ff9d00,
        0 0 20px #ff6600,
        0 0 35px #ff2200;

    margin-bottom:10px;
}

.durga-title{
    color:#ffb300;

    font-family:
        "Noto Sans Bengali",
        "Nirmala UI",
        Arial,
        sans-serif;

    font-size:52px;

    font-weight:800;

    line-height:1.3;

    text-shadow:
        0 2px 5px #000,
        0 0 12px #ff6a00;
}


/* =========================
   INFORMATION SECTION
========================= */

.info-section{
    width:100%;

    display:grid;

    grid-template-columns:repeat(3,1fr);

    background:#170000;

    border-bottom:2px solid #624500;
}


/* =========================
   INFO BOX
========================= */

.info-box{
    min-height:410px;

    padding:55px 35px;

    text-align:center;

    border-right:1px solid #624500;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.info-box:last-child{
    border-right:none;
}


/* =========================
   ICON
========================= */

.info-icon{
    width:150px;
    height:150px;

    border:4px solid #ffd000;

    border-radius:50%;

    background:#190000;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:28px;

    flex-shrink:0;

    box-shadow:
        0 0 10px rgba(255,190,0,.15);
}

.info-icon span{
    font-size:68px;

    line-height:1;
}
