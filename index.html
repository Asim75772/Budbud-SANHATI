<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Budbud SANHATI</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#0b0b0b;
  color:white;
}

.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.85)),
    radial-gradient(circle at center,#8e0000,#120000 70%);
}

.hero-content{
  max-width:800px;
}

.logo{
  width:120px;
  height:120px;
  border:4px solid #ffd54a;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  background:#111;
  box-shadow:0 0 30px rgba(255,213,74,.5);
}

h1{
  font-size:48px;
  margin-top:25px;
  color:#ffd54a;
  letter-spacing:2px;
}

h2{
  font-size:25px;
  margin:15px 0;
}

p{
  color:#ddd;
  font-size:18px;
  line-height:1.7;
}

.btn{
  display:inline-block;
  margin-top:30px;
  padding:14px 30px;
  border-radius:30px;
  background:#e50914;
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.btn:hover{
  background:#ff2631;
}

@media(max-width:600px){
  h1{
    font-size:36px;
  }

  h2{
    font-size:21px;
  }

  p{
    font-size:16px;
  }
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-content">

    <div class="logo">S</div>

    <h1>Budbud SANHATI</h1>

    <h2>বুদবুদ সংহতি</h2>

    <p>
      আমাদের ঐতিহ্য, সংস্কৃতি ও একতার বন্ধন।
      <br>
      Budbud Sanhati-এর অফিসিয়াল ওয়েবসাইটে আপনাকে স্বাগতম।
    </p>

    <a href"home.html" class="btn">স্বাগতম</a>

  </div>
</section>

</body>
</html>
