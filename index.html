<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


html{
scroll-behavior:smooth;
}


body{

background:#050000;
color:#fff;

font-family:"Noto Serif Bengali",serif;

overflow-x:hidden;

}


a{
color:inherit;
text-decoration:none;
}


img{
max-width:100%;
display:block;
}



/* NAVBAR */

.navbar{

position:sticky;
top:0;

z-index:9999;

height:70px;

background:#050505;

border-bottom:3px solid #e00000;

display:flex;

align-items:center;

overflow-x:auto;

}


.nav-menu{

display:flex;

gap:45px;

list-style:none;

padding:0 35px;

margin:auto;

min-width:max-content;

}


.nav-menu a{

color:#f3d49a;

font-family:Georgia,serif;

font-size:20px;

font-weight:700;

white-space:nowrap;

}


.nav-menu a:hover{

color:#ff0000;

}



/* HERO */


.hero{

background:#000;

border-bottom:3px solid #e00000;

overflow:hidden;

}


.hero img{

width:100%;

height:auto;

object-fit:contain;

}



/* QUICK SECTION */


.quick-section{

display:grid;

grid-template-columns:repeat(4,1fr);

background:#080000;

border-bottom:2px solid #401500;

}


.quick-card{

padding:28px 18px;

text-align:center;

border-right:1px solid #552000;

transition:.3s;

}


.quick-card:hover{

background:#130000;

}


.quick-icon{

width:70px;

height:70px;

margin:0 auto 12px;

border:2px solid #8c6500;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:36px;

}


.quick-card h3{

color:#ffc400;

font-size:21px;

margin-bottom:8px;

}


.quick-card p{

color:#ddd;

font-size:14px;

line-height:1.8;

}



/* EDITOR */


.editor-section{

padding:65px 20px 70px;

background:

linear-gradient(

180deg,

#080000,

#160000,

#070000

);

border-bottom:2px solid #551000;

}


.editor-title{

text-align:center;

color:#ffc400;

font-size:36px;

margin-bottom:15px;

}


.editor-line{

width:90px;

height:3px;

background:#e00000;

margin:0 auto 30px;

}


.editor-card{

max-width:900px;

margin:auto;

background:#120000;

border:1px solid #702500;

border-radius:16px;

padding:30px;

text-align:center;

}


.editor-card h3{

color:#ffe09a;

font-size:24px;

margin-bottom:15px;

}


.editor-card p{

color:#eee;

font-size:16px;

line-height:2;

}


.editor-sign{

margin-top:20px;

color:#ffc400;

font-weight:bold;

}



/* COMMON */


.section{

padding:70px 20px;

background:#070000;

border-bottom:1px solid #401500;

}


.container{

max-width:1050px;

margin:auto;

}


.title{

text-align:center;

color:#ffc400;

font-size:36px;

margin-bottom:40px;

}


.grid{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:25px;

}


.card{

background:#120000;

border:1px solid #702500;

border-radius:15px;

padding:30px 20px;

text-align:center;

}


.card-icon{

font-size:48px;

margin-bottom:15px;

}


.card h3{

color:#ffc400;

font-size:23px;

margin-bottom:15px;

}


.card p{

color:#ddd;

line-height:1.8;

}
