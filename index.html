<!DOCTYPE html>
<html lang="bn">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Budbud SANHATI | স্বাগতম</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, "Noto Sans Bengali", sans-serif;
    text-align: center;
}

/* Logo Area */
.logo-area {
    padding: 20px 15px 15px;
    background: #050505;
}

/* Logo */
.logo {
    width: 110px;
    height: 110px;

    object-fit: contain;

    display: block;

    margin: 0 auto;

    border: none;
    border-radius: 50%;

    background: transparent;
}

/* Banner */
.banner {
    width: 100%;
    height: auto;
    display: block;
}

/* Welcome Area */
.welcome {
    padding: 25px 15px 35px;
    background: #050505;
}

/* Welcome Button */
.btn {
    display: inline-block;

    padding: 14px 35px;

    background: #ff1744;
    color: white;

    border-radius: 30px;

    text-decoration: none;

    font-size: 18px;
    font-weight: bold;

    box-shadow: 0 5px 15px rgba(255,23,68,.4);
}

.btn:hover {
    background: #ffd21a;
    color: #111;
}

/* Mobile */
@media (max-width: 600px) {

    .logo-area {
        padding: 15px 10px 10px;
    }

    .logo {
        width: 90px;
        height: 90px;
    }

    .welcome {
        padding: 20px 15px 30px;
    }

    .btn {
        padding: 12px 30px;
        font-size: 17px;
    }

}

</style>

</head>

<body>

<!-- Logo -->
<div class="logo-area">

    <img
        src="budbud-logo-transparent-1.png"
        class="logo"
        alt="Budbud SANHATI Logo"
    >

</div>

<!-- Banner -->
<img
    src="home-banner.png"
    class="banner"
    alt="Budbud SANHATI Banner"
>

<!-- Welcome Button -->
<div class="welcome">

    <a href="./home.html" class="btn">
        স্বাগতম
    </a>

</div>

</body>

</html>
