<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Budbud SANHATI</title>

<meta name="description" content="Budbud SANHATI - একটি সংস্কৃতি, একটি পরিবার, একটি অঙ্গীকার">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050000;
    color:white;
    font-family:"Noto Serif Bengali",serif;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

/* NAVBAR */
.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:#050505;
    border-bottom:3px solid #e00000;
}

.nav-menu{
    min-height:68px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:45px;
    list-style:none;
    padding:0 20px;
}

.nav-menu a{
    color:#f3d49a;
    font-size:18px;
    font-weight:700;
    padding:20px 0;
}

.nav-menu a:hover{
    color:#ff2020;
}

/* HERO */
.hero{
    text-align:center;
    background:
        radial-gradient(circle at center,#350000 0%,#100000 50%,#050000 100%);
    padding:70px 20px 60px;
    border-bottom:2px solid #7c0000;
}

.hero h1{
    color:#ffc400;
    font-size:48px;
    margin-bottom:15px;
}

.hero p{
    color:#eee;
    font-size:19px;
    line-height:2;
    max-width:800px;
    margin:auto;
}

.hero-button{
    display:inline-block;
    margin-top:30px;
    padding:14px 32px;
    background:linear-gradient(#ff1b1b,#d50000);
    border:3px solid #ffc400;
    border-radius:14px;
    color:#ffe8a0;
    font-size:21px;
    font-weight:800;
    box-shadow:0 0 20px rgba(255,180,0,.4);
}
